name: Build frontend and deploy to Dokploy

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-dokploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}:${{ steps.target.outputs.tag }}
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for recovery checks
        uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend-trama/package-lock.json

      - name: Verify password recovery and music catalog
        working-directory: frontend-trama
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- src/pages/Access.test.tsx src/pages/RecoveryPage.test.tsx src/data/api.test.ts src/components/MusicInspirations.test.tsx

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Select image tag and environment
        id: target
        run: |
          case "$GITHUB_REF_NAME" in
            dev) printf 'tag=dev\nenvironment=testing\n' ;;
            main) printf 'tag=production\nenvironment=production\n' ;;
            *) exit 1 ;;
          esac >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend-trama
          file: ./frontend-trama/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.target.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ steps.target.outputs.tag }}-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.environment }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Request production deploy with the service webhook
        if: github.ref == 'refs/heads/main'
        env:
          DOKPLOY_DEPLOY_WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
          DOKPLOY_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$DOKPLOY_DEPLOY_WEBHOOK" =~ ^https://policloud[.]ipm[.]edu[.]ar/api/deploy/[A-Za-z0-9_-]{12,}$ ]]; then
            echo '::error::Set the dedicated Dokploy webhook in the production environment.'
            exit 1
          fi
          if [[ "$DOKPLOY_IMAGE" != "ghcr.io/${GITHUB_REPOSITORY,,}:production" ]]; then
            echo '::error::Only the production image of this repository can be deployed.'
            exit 1
          fi
          payload=$(jq -cn --arg image "$DOKPLOY_IMAGE" '{registry_package:{package_version:{package_url:$image,container_metadata:{tag:{name:"production"}}}}}')
          result=$(curl --fail --silent --show-error --proto '=https' --connect-timeout 15 --max-time 120 \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: registry_package' \
            --data "$payload" "$DOKPLOY_DEPLOY_WEBHOOK")
          jq -e '.message == "Application deployed successfully"' <<< "$result" > /dev/null
          echo 'Dokploy accepted the production deployment request.'
      - name: Request deployment in Dokploy
        if: github.ref == 'refs/heads/dev'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
          EXPECTED_IMAGE: ${{ needs.build-and-push.outputs.image }}
          EXPECTED_APPLICATION_ID: eRDil3bftJ2Z0YORZZuqH
          EXPECTED_ENVIRONMENT_ID: iHPH9mt5Wrk3DJ_L78qr2
        run: |
          set -euo pipefail

          : "${DOKPLOY_URL:?Missing GitHub Actions secret: DOKPLOY_URL}"
          : "${DOKPLOY_API_KEY:?Missing GitHub Actions secret: DOKPLOY_API_KEY}"
          : "${DOKPLOY_APPLICATION_ID:?Missing GitHub Actions secret: DOKPLOY_APPLICATION_ID}"
          if [[ "$DOKPLOY_APPLICATION_ID" != "$EXPECTED_APPLICATION_ID" ]]; then
            echo "::error::The configured application is not the deployment target for this branch."
            exit 1
          fi

          if [[ "$DOKPLOY_URL" != https://* ]]; then
            echo "::error::DOKPLOY_URL must use HTTPS to protect the API key."
            exit 1
          fi

          # Reject a different service, environment or provider before requesting a deploy.
          : "${EXPECTED_IMAGE:?Missing expected image}"
          metadata=$(curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --get "${DOKPLOY_URL%/}/api/application.one" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data-urlencode "applicationId=$DOKPLOY_APPLICATION_ID")
          jq --exit-status \
            --arg id "$EXPECTED_APPLICATION_ID" \
            --arg environment "$EXPECTED_ENVIRONMENT_ID" \
            --arg image "${EXPECTED_IMAGE,,}" \
            '.applicationId == $id and .environmentId == $environment and .sourceType == "docker" and .dockerImage == $image' \
            <<< "$metadata" > /dev/null || {
              echo "::error::Frontend must use the expected deployment environment, Docker provider and image. No deployment requested."
              exit 1
            }

          payload=$(jq -n --arg applicationId "$DOKPLOY_APPLICATION_ID" \
            '{applicationId: $applicationId}')

          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --request POST "${DOKPLOY_URL%/}/api/application.deploy" \
            --header "accept: application/json" \
            --header "Content-Type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --data "$payload"

          echo "Deployment requested. Check its progress in Dokploy > Deployments."
